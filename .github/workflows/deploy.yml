name: Deploy to Aliyun Server

on:
  push:
    branches:
      - deploy
  pull_request:
    branches:
      - deploy

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Build frontend
        working-directory: frontend
        run: npm run build-only

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn -B -ntp clean package -DskipTests

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd /home/workspace/CPT202
            
            git fetch origin
            git reset --hard origin/deploy
            git pull origin deploy

            sudo mkdir -p /opt/expertlink/ssl /opt/expertlink/nginx
            sudo cp deploy/nginx/fullchain.pem /opt/expertlink/ssl/
            sudo cp deploy/nginx/private.key /opt/expertlink/ssl/
            sudo cp deploy/nginx/default.conf /opt/expertlink/nginx/            

            docker-compose up -d --build
            
            docker image prune -af

