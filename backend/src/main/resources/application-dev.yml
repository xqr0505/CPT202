spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/cpt202_consultancy?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: root
    password: 12345 # Your password
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000ms}

  devtools:
    restart:
      enabled: true

server:
  port: 8081
# JWT config
jwt:
  secret: dev-secret-key-with-at-least-32-characters

# API
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# log
logging:
  level:
    root: INFO
    edu.xjtlu.cpt202: DEBUG
