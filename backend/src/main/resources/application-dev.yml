spring:
  datasource:
    url: jdbc:mysql://localhost:3306/expertlink_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  devtools:
    restart:
      enabled: true

logging:
  level:
    edu.xjtlu.cpt202.backend: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# API
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true