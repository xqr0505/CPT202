spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cpt202_consultancy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456 # Your password
    driver-class-name: com.mysql.cj.jdbc.Driver

  devtools:
    restart:
      enabled: true

# JWT 秘钥配置（开发环境）
# 秘钥长度必须 >= 32 字符（256 位）
jwt:
  secret: dev-secret-key-with-at-least-32-characters

# API 文档
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 日志
logging:
  level:
    root: INFO
    edu.xjtlu.cpt202: DEBUG
