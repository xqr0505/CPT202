spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:9001}/cpt202_consultancy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia%2FShanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:9002}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000ms}

  devtools:
    restart:
      enabled: true

server:
  port: 8081
# JWT config
jwt:
  secret: dev-secret-key-with-at-least-32-characters

# API
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# log
logging:
  level:
    root: INFO
    edu.xjtlu.cpt202: DEBUG

ai:
  tools:
    parallel:
      enabled: ${AI_TOOLS_PARALLEL_ENABLED:false}
      max-concurrency: ${AI_TOOLS_PARALLEL_MAX_CONCURRENCY:2}
      timeout-ms: ${AI_TOOLS_PARALLEL_TIMEOUT_MS:60000}
  rag:
    redis:
      host: ${AI_RAG_REDIS_HOST:${REDIS_HOST:127.0.0.1}}
      port: ${AI_RAG_REDIS_PORT:${REDIS_PORT:9002}}
      username: ${AI_RAG_REDIS_USERNAME:}
      password: ${AI_RAG_REDIS_PASSWORD:${REDIS_PASSWORD:}}
