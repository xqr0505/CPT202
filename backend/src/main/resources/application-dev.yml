spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/cpt202_consultancy?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  devtools:
    restart:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    fail-on-missing-locations: true


logging:
  level:
    edu.xjtlu.cpt202.backend: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# API
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true