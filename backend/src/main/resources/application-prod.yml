spring:
  datasource:
    url: jdbc:mysql://db:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  devtools:
    restart:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080

logging:
  level:
    root: INFO
    edu.xjtlu.cpt202: INFO