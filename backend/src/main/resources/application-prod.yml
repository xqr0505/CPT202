spring:
  datasource:
    url: jdbc:mysql://db:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia%2FShanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000ms}

  devtools:
    restart:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080

logging:
  level:
    root: INFO
    edu.xjtlu.cpt202: INFO
