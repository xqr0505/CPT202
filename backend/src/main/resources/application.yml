spring:
  application:
    name: backend
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    fail-on-missing-locations: true
  mail:
    host: smtp.qq.com
    port: 587
    username: 2906326615@qq.com
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true   # 开启STARTTLS
            required: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:5MB}

expertlink:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET:}
    base-url: ${OSS_BASE_URL:}
  logging:
    enabled: ${COMMON_LOGGING_ENABLED:true}
    arg-max-length: ${COMMON_LOGGING_ARG_MAX_LENGTH:120}
    ai-chat-profiling-enabled: ${COMMON_LOGGING_AI_CHAT_PROFILING_ENABLED:true}
    slow-threshold:
      controller-ms: ${COMMON_LOGGING_SLOW_THRESHOLD_CONTROLLER_MS:800}
      service-ms: ${COMMON_LOGGING_SLOW_THRESHOLD_SERVICE_MS:500}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model-name: ${OPENAI_MODEL_NAME:}
    base-url: ${OPENAI_BASE_URL:}
  embedding:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: ${DASHSCOPE_EMBEDDING_MODEL_NAME:text-embedding-v2}
      dimension: ${DASHSCOPE_EMBEDDING_DIMENSION:1536}
  rag:
    enabled: ${AI_RAG_ENABLED:true}
    knowledge-location: ${AI_RAG_KNOWLEDGE_LOCATION:classpath*:/knowledge/**/*.md}
    rewrite:
      enabled: ${AI_RAG_REWRITE_ENABLED:true}
      mode: ${AI_RAG_REWRITE_MODE:rule}
      timeout-ms: ${AI_RAG_REWRITE_TIMEOUT_MS:1500}
      max-queries: ${AI_RAG_REWRITE_MAX_QUERIES:2}
      light-model-name: ${AI_RAG_REWRITE_LIGHT_MODEL_NAME:qwen-turbo}
    redis:
      host: ${AI_RAG_REDIS_HOST:${REDIS_HOST:127.0.0.1}}
      port: ${AI_RAG_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${AI_RAG_REDIS_USERNAME:}
      password: ${AI_RAG_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      index-name: ${AI_RAG_REDIS_INDEX_NAME:expertlink:rag:knowledge}
      prefix: ${AI_RAG_REDIS_PREFIX:expertlink:rag:segment:}
    max-results: ${AI_RAG_MAX_RESULTS:5}
    min-score: ${AI_RAG_MIN_SCORE:0.65}
  chat:
    memory:
      max-messages: ${AI_CHAT_MEMORY_MAX_MESSAGES:8}
      ttl-seconds: ${AI_CHAT_MEMORY_TTL_SECONDS:86400}
      key-prefix: ${AI_CHAT_MEMORY_KEY_PREFIX:expertlink:ai:memory}
  tools:
    parallel:
      enabled: ${AI_TOOLS_PARALLEL_ENABLED:true}
      max-concurrency: ${AI_TOOLS_PARALLEL_MAX_CONCURRENCY:4}
      timeout-ms: ${AI_TOOLS_PARALLEL_TIMEOUT_MS:60000}
      read-only-names:
        - searchCurrentCustomerBookings
        - searchKnowledgeBase


# Logging
logging:
  level:
    edu.xjtlu.cpt202.backend: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"

# 客户取消 / 改期规则（第一步：试算接口读取）
booking:
  specialist-approval:
    timeout-minutes: ${SPECIALIST_APPROVAL_TIMEOUT_MINUTES:1440}
  customer-change:
    full-refund-lead-hours: 24
    min-lead-hours: 2
    late-window-penalty-ratio: "0.30"
