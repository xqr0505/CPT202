services:
  db:
    image: mysql:8.0
    container_name: expertlink-db-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00"]
    ports:
      - "9001:3306"
    volumes:
      - db_data_dev:/var/lib/mysql

  redis:
    image: redis/redis-stack-server:latest
    container_name: expertlink-redis-dev
    restart: always
    environment:
      - REDIS_ARGS=--appendonly yes --protected-mode no
    ports:
      - "9002:6379"

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: expertlink-redisinsight-dev
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis
      

  pma:
    image: phpmyadmin:5
    container_name: expertlink-pma-dev
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9003:80"
    depends_on:
      - db

  backend:
    profiles:
      - docker-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: expertlink-backend-dev
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia%2FShanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Shanghai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-5000ms}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - AI_INTENT_ROUTER_API_KEY=${AI_INTENT_ROUTER_API_KEY:-${OPENAI_API_KEY}}
      - AI_INTENT_ROUTER_MODEL_NAME=${AI_INTENT_ROUTER_MODEL_NAME:-${AI_RAG_REWRITE_LIGHT_MODEL_NAME:-${OPENAI_MODEL_NAME}}}
      - AI_INTENT_ROUTER_BASE_URL=${AI_INTENT_ROUTER_BASE_URL:-${OPENAI_BASE_URL}}
      - AI_INTENT_ROUTER_TIMEOUT_MS=${AI_INTENT_ROUTER_TIMEOUT_MS:-3500}
      - AI_RAG_ENABLED=${AI_RAG_ENABLED:-true}
      - AI_RAG_REDIS_HOST=redis
      - AI_RAG_REDIS_PORT=6379
      - AI_RAG_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_EMBEDDING_MODEL_NAME=${DASHSCOPE_EMBEDDING_MODEL_NAME:-text-embedding-v2}
      - DASHSCOPE_EMBEDDING_DIMENSION=${DASHSCOPE_EMBEDDING_DIMENSION:-1536}
      - AI_RAG_REWRITE_ENABLED=${AI_RAG_REWRITE_ENABLED:-true}
      - AI_RAG_REWRITE_MODE=${AI_RAG_REWRITE_MODE:-rule}
      - AI_RAG_REWRITE_TIMEOUT_MS=${AI_RAG_REWRITE_TIMEOUT_MS:-1500}
      - AI_RAG_REWRITE_MAX_QUERIES=${AI_RAG_REWRITE_MAX_QUERIES:-2}
      - AI_RAG_REWRITE_LIGHT_MODEL_NAME=${AI_RAG_REWRITE_LIGHT_MODEL_NAME:-qwen-turbo}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_REGION=${OSS_REGION:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_BASE_URL=${OSS_BASE_URL:-}
    volumes:
      - ./backend:/app
      - maven_repo_dev:/root/.m2
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: expertlink-frontend-dev
    restart: always
    environment:
      - VITE_API_BASE_URL=${FRONTEND_VITE_API_BASE_URL_DEV:-http://localhost:8081/api}
    ports:
      - "5331:5331"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5331"]
    volumes:
      - ./frontend:/app
      - node_modules_dev:/app/node_modules

volumes:
  db_data_dev:
  maven_repo_dev:
  node_modules_dev:

